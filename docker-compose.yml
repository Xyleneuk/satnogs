name: satnogs

services:
  rigctld:
    image: librespace/hamlib:4.0
    user: "999"
    read_only: true
    environment:
      MODEL: "1"
    restart: unless-stopped
    command: rigctld

  satnogs_client:
    image: knegge/satnogs-client:lsf-addons
    user: "999"
    group_add:
      - "46"
    privileged: true
    init: true
    env_file:
      - ./station.env
    environment:
      SATNOGS_RIG_IP: rigctld
      SATNOGS_RIG_PORT: "4532"
    command: satnogs-client
    devices:
      - /dev/bus/usb:/dev/bus/usb
    tmpfs:
      - /tmp
      - /dev/shm
    volumes:
      - /mnt/satnogs:/var/lib/satnogs-client
      - ./meteor.sh:/opt/scripts/meteor.sh:ro
    restart: unless-stopped
    stop_grace_period: 1s
